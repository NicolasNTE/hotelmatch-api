spring:
  application:
    name: hotelmatch-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotelmatch}
    username: ${DB_USER:hotelmatch}
    password: ${DB_PASSWORD:hotelmatch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 50
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

hotelmatch:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  cancellation-window-hours: 48
  security:
    # Solo para desarrollo local: en cualquier despliegue definir JWT_SECRET (mínimo 32 caracteres).
    jwt-secret: ${JWT_SECRET:hotelmatch-dev-only-secret-change-me-0123456789}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
