# Despliegue en la nube con PostgreSQL gestionado (Neon). Las variables las define la plataforma; no hay secretos aquí.
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST_UNPOOLED:${PGHOST:localhost}}/${PGDATABASE:hotelmatch}?sslmode=require
    username: ${PGUSER:hotelmatch}
    password: ${PGPASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

hotelmatch:
  seed-demo-data: ${SEED_DEMO_DATA:true}

# Vercel termina TLS en su proxy: sin esto OpenAPI publica el servidor como http y el navegador bloquea "Try it out".
server:
  forward-headers-strategy: framework
